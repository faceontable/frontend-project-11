<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS Агрегатор</title>
  </head>

  <body>
    <div id="app">
      <div
        class="search-form bg-slate-800 text-white py-16 px-4 md:px-8 shadow-md"
      >
        <h1 class="text-4xl">RSS Агрегатор</h1>
        <p>Начните читать RSS сегодня! Это легко, это красиво.</p>
        <form>
          <div class="flex flex-col sm:flex-row gap-3">
            <label for="url-input" class="sr-only">Ссылка RSS</label>
            <input
              class="flex-grow px-4 py-3 border border-slate-300 mt-1 block w-full rounded-md shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 text-black"
              type="text"
              placeholder="Ссылка RSS"
              id="url-input"
              name="url"
            />
            <button
              class="px-6 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium rounded-md"
              type="submit"
            >
              Добавить
            </button>
          </div>
          <p>Например https://ru.hexlet.io/lessons.rss</p>
          <p class="feedback text-sm mt-2"></p>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
