<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS Агрегатор</title>
  </head>

  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="app">
      <div
        class="search-form bg-slate-800 text-white py-12 md:py-16 px-4 md:px-8 shadow-md"
      >
        <div class="max-w-4xl mx-auto">
          <h1 class="text-4xl font-bold mb-3" data-i18n="rss-aggregator.title">
            RSS Агрегатор
          </h1>
          <p
            class="text-lg text-slate-300 mb-6"
            data-i18n="rss-aggregator.description"
          >
            Начните читать RSS сегодня! Это легко, это красиво.
          </p>
          <form class="max-w-2xl">
            <div class="flex flex-col sm:flex-row gap-3">
              <label
                for="url-input"
                class="sr-only"
                data-i18n="rss-aggregator.form.placeholder"
              >
                Ссылка RSS
              </label>
              <input
                class="flex-grow px-4 py-3 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900"
                type="text"
                placeholder="Ссылка RSS"
                id="url-input"
                name="url"
                data-i18n="[placeholder]rss-aggregator.form.placeholder"
              />
              <button
                class="px-6 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium rounded-md shadow-sm transition-colors"
                type="submit"
                data-i18n="rss-aggregator.form.submit"
              >
                Добавить
              </button>
            </div>
            <p
              class="text-sm text-slate-400 mt-2 mb-1"
              data-i18n="rss-aggregator.form.example"
            >
              Например https://ru.hexlet.io/lessons.rss
            </p>
            <p class="feedback text-sm font-medium min-h-[1.25rem]"></p>
          </form>
        </div>
      </div>

      <main class="max-w-4xl mx-auto px-4 py-8 md:py-12">
        <section id="feeds-section" class="hidden mb-10">
          <h2
            class="text-2xl font-bold mb-4 text-slate-900"
            data-i18n="rss-aggregator.feeds.title"
          >
            Feeds
          </h2>
          <div
            class="border border-slate-200 rounded-lg p-6 bg-white shadow-sm"
          >
            <ul id="feeds" class="divide-y divide-slate-200"></ul>
          </div>
        </section>

        <section id="posts-section" class="hidden">
          <h2
            class="text-2xl font-bold mb-4 text-slate-900"
            data-i18n="rss-aggregator.posts.title"
          >
            Posts
          </h2>
          <div
            class="border border-slate-200 rounded-lg bg-white shadow-sm overflow-hidden"
          >
            <ul id="posts" class="divide-y divide-slate-200 mb-0"></ul>
          </div>
        </section>
      </main>

      <dialog
        class="w-full max-w-lg rounded-lg border-0 bg-white p-0 shadow-xl backdrop:bg-slate-900/50 fixed inset-0 m-auto"
      >
        <div data-test="modal-body">
          <div
            class="flex items-start justify-between gap-4 border-b border-slate-200 px-6 py-4"
          >
            <h3 class="text-lg font-bold text-slate-900" data-modal-title></h3>
            <button
              type="button"
              class="shrink-0 text-2xl leading-none text-slate-400 hover:text-slate-600"
              data-modal-close
            >
              &times;
            </button>
          </div>

          <div class="px-6 py-4">
            <p class="text-slate-700" data-modal-description></p>
          </div>

          <div
            class="flex justify-end gap-3 border-t border-slate-200 px-6 py-4"
          >
            <a
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="px-6 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium rounded-md shadow-sm transition-colors"
              data-i18n="rss-aggregator.posts.modal.readMore"
              data-modal-link
            >
              Читать полностью
            </a>
            <button
              type="button"
              class="px-6 py-3 bg-slate-500 hover:bg-slate-600 active:bg-slate-700 text-white font-medium rounded-md shadow-sm transition-colors"
              data-i18n="rss-aggregator.posts.modal.close"
              data-modal-close
            >
              Закрыть
            </button>
          </div>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
